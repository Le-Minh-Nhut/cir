schema_version: 1
seed: 42

data:
  dataset: fashioniq
  dataset_root: data/fashionIQ_dataset
  cache_root: features
  train_caption_policy: normalized_ordered_and
  validation_caption_policy: normalized_ordered_and
  correction_policy: fashioniq
  validation_protocol: fashioniq_original
  no_generated_data: true

backbone:
  model_id: qihoo360/fg-clip2-base
  revision: 430fbc8a912c86fd4de601381b6245a0edab22f0
  text_walk_type: short
  max_text_length: 64
  text_tuning:
    mode: last_n_blocks
    num_unfrozen_blocks: 4
    train_final_norm: true
    train_projection: false
  vision_tuning:
    mode: frozen
    num_unfrozen_blocks: 0

model:
  d_model: 256
  num_queries: 4

policy:
  min_steps: 1
  max_steps: 4
  allow_repeat: true
  stop_anchor: 0.0
  step_cost: 0.0

teacher:
  metric: common_negative_delta_infonce
  hard_negatives: 64
  retrieval_temperature: 0.07
  same_set_across_candidates: true

loss:
  terminal: bidirectional_multipos_infonce
  retrieval_temperature: 0.07
  utility: stop_anchored_listwise_kl
  utility_weight: 1.0

training:
  curriculum_mode: canonical_v4
  health_gate_mode: manual_approval
  approved_health_gates: []
  bypass_health_gates_for_smoke: false
  epochs: 60
  max_optimizer_updates: 4260
  batch_size: 32
  eval_batch_size: 64
  gradient_accumulation: 8
  num_workers: 4

optimizer:
  actor_lr: 0.0002
  utility_lr: 0.0003
  text_lr: 0.000005
  weight_decay: 0.05
  betas: [0.9, 0.98]
  eps: 0.00000001
  gradient_clip: 1.0
  ema_decay: 0.999

runtime:
  device: cuda
  precision: bf16
  output_dir: runs/taper-mag-v4-fgclip2-base-last4
