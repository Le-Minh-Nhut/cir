name: taper_e2e

batch_size: 64
eval_batch_size: 32
num_workers: 8

num_epochs: 10

lr: 1.0e-4
weight_decay: 1.0e-4

train_caption_policy: normalized_ordered_and
val_caption_policy: normalized_ordered_and
correction_policy: fashioniq
text_cache_subdir: text

loss_weights:
  retrieval_loss: 1.0

model:
  text_dim: 1024
  reference_dim: 1024
  query_dim: 1024

  slot_dim: 1024
  state_dim: 512

  num_slots: 4
  num_primitives: 8

  mask_temperature: 1.0
  router_temperature: 1.0
  retrieval_temperature: 0.07

  qasa_tau: 0.5
  qasa_rho: 0.8
  qasa_mu: 0.3
  qasa_eps: 1.0e-8
  qasa_apply_at_eval: true
  alpha_max: 1.0

backbone:
  model_id: qihoo360/fg-clip2-large
  revision: 4d1d5dc35c716902f07c172dbfc23b82a7bc6bf3
  max_text_length: 64
