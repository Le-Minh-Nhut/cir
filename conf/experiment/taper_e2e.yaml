name: taper_e2e

batch_size: 32
eval_batch_size: 16
num_workers: 4

num_epochs: 100

lr: 1.0e-4
weight_decay: 1.0e-4

train_caption_policy: normalized_ordered_and
val_caption_policy: normalized_ordered_and

loss_weights:
  retrieval_loss: 1.0

model:
  text_dim: 768
  reference_dim: 1408
  teacher_text_dim: 768
  teacher_query_dim: 256
  query_dim: 256

  slot_dim: 512
  state_dim: 512

  num_slots: 4
  num_primitives: 8

  mask_temperature: 1.0
  router_temperature: 1.0
  retrieval_temperature: 0.07

  neutral_mode: zero

  slot_gate_threshold: 0.5
  hard_slot_gating_during_training: false
  gate_mode: legacy_soft_train_hard_eval
  st_gate_recovery: false

  alpha_max: 1.0
  counterfactual_chunk_size: 16

teacher:
  csmcir_root: teacher/repos/CSMCIR
  checkpoint_path: teacher/checkpoints/csmcir/fashioniq_tuned_clip_best.pt