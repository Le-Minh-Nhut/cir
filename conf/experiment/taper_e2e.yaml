name: taper_e2e

batch_size: 64
eval_batch_size: 32
num_workers: 8

num_epochs: 10

lr: 1.0e-4
weight_decay: 1.0e-4

train_caption_policy: normalized_ordered_and
val_caption_policy: normalized_ordered_and

loss_weights:
  retrieval_loss: 1.0

model:
  text_dim: 768
  reference_dim: 1408
  teacher_text_dim: 768
  teacher_query_dim: 256
  query_dim: 256

  slot_dim: 512
  state_dim: 512

  num_slots: 4
  num_primitives: 8

  mask_temperature: 1.0
  router_temperature: 1.0
  retrieval_temperature: 0.07

  neutral_mode: zero
  qasa_tau: 0.5
  qasa_rho: 0.8
  qasa_mu: 0.3
  qasa_eps: 1.0e-8
  qasa_apply_at_eval: true
  alpha_max: 1.0
  counterfactual_chunk_size: 32

  slot_value_source: teacher_raw
  slot_effect_in_value: false
  slot_value_assignment: hard_st_exclusive

teacher:
  csmcir_root: teacher/repos/CSMCIR
  checkpoint_path: teacher/checkpoints/csmcir/fashioniq_tuned_clip_best.pt
