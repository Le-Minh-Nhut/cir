name: encoder_binding_e2e

batch_size: 128
eval_batch_size: 128
gallery_batch_size: 128
num_workers: 8
num_epochs: 10

lr: 1.0e-4
weight_decay: 1.0e-4

train_caption_policy: normalized_ordered_and
val_caption_policy: normalized_ordered_and
correction_policy: fashioniq
text_cache_subdir: text_a8_global
global_image_cache_subdir: images
dense_image_cache_subdir: dense_images

loss_weights:
  retrieval_loss: 1.0
  entity_action_loss: 1.0
  relation_ortho_loss: 1.0

model:
  dim: 1024
  num_relations: 4
  fusion_hidden_dim: 1024
  retrieval_temperature: 0.07
  entity_action_temperature: 0.07

backbone:
  model_id: qihoo360/fg-clip2-large
  revision: 4d1d5dc35c716902f07c172dbfc23b82a7bc6bf3
  max_text_length: 64
