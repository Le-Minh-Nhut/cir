schema_version: 1
control: {id: M1, name: text_only}
seed: 42
data:
  dataset: fashioniq
  dataset_root: data/FashionIQ
  cache_root: features
  train_caption_policy: normalized_ordered_and
  validation_caption_policy: normalized_ordered_and
  correction_policy: fashioniq
  validation_protocol: fashioniq_original
  no_generated_data: true
backbone:
  model_id: qihoo360/fg-clip2-base
  revision: 430fbc8a912c86fd4de601381b6245a0edab22f0
  text_walk_type: short
  max_text_length: 64
  text_tuning:
    mode: last_n_blocks
    num_unfrozen_blocks: 4
    train_final_norm: true
    train_projection: false
  vision_tuning: {mode: frozen, num_unfrozen_blocks: 0}
model: {variant: content_pool_projection}
loss: {terminal: bidirectional_multipos_infonce, retrieval_temperature: 0.07}
training:
  epochs: 60
  max_optimizer_updates: 4260
  batch_size: 32
  eval_batch_size: 64
  gradient_accumulation: 8
  num_workers: 4
optimizer:
  actor_lr: 0.0002
  text_lr: 0.000005
  weight_decay: 0.05
  betas: [0.9, 0.98]
  eps: 0.00000001
  gradient_clip: 1.0
runtime:
  device: cuda
  precision: bf16
  output_dir: runs/fgclip2-base-m1-text-only
