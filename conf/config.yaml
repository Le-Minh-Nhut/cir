defaults:
  - dataset: fashioniq
  - protocol: fashioniq_original
  - experiment: default
  - _self_

seed: 42

runtime:
  device: auto
  accelerator_index: 0
  precision: fp16
  deterministic: true
  benchmark: false

paths:
  data_root: ${oc.env:CIR_DATA_ROOT,data}
  cache_root: ${oc.env:CIR_CACHE_ROOT,features}
  output_root: ${hydra:runtime.output_dir}

hydra:
  job:
    chdir: false
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
