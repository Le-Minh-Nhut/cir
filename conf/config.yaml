defaults:
  - dataset: fashioniq
  - model: sequential_r0
  - backbone: fgclip_base_full
  - objective: sequential_r0
  - experiment: sequential_r0
  - protocol: fashioniq_original
  - _self_

seed: 42

runtime:
  device: auto
  accelerator_index: 0
  precision: fp16
  deterministic: true
  benchmark: false

paths:
  data_root: ${oc.env:CIR_DATA_ROOT,data}
  output_root: ${hydra:runtime.output_dir}

hydra:
  job:
    chdir: false
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
