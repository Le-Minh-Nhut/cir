name: iag_srme_r1c2_dynamic_reproposal
width: 256
num_candidates: 4
max_steps: 3
num_heads: 8
lambda_z: 0.10
# Preserve the successful R1a recurrent retrieval condition.
query_cap: 1000.0
selector_temperature: 1.0
selector_gumbel_noise: true
enable_claim_head: false
enable_factor_head: false
factor_dim: null
enable_visual_null: false
visual_null_initial_logit: 0.0
# R1b WHETHER remains absent from this causal experiment.
enable_dynamic_applicability: false
initial_applicability: 0.98
grounding_normalization: entmax15
# Preserve R1c1 current-state WHERE and add only current-state WHAT reproposal.
enable_dynamic_regrounding: true
enable_dynamic_reproposal: true
