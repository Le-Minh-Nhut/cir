name: iag_srme_r1c1_dynamic_reground
width: 256
num_candidates: 4
max_steps: 3
num_heads: 8
lambda_z: 0.10
# R1a recurrent-readout condition; not an R1c1 intervention.
query_cap: 1000.0
selector_temperature: 1.0
selector_gumbel_noise: true
enable_claim_head: false
enable_factor_head: false
factor_dim: null
enable_visual_null: false
visual_null_initial_logit: 0.0
# R1b WHETHER is explicitly absent from canonical R1c1.
enable_dynamic_applicability: false
