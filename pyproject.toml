[project]
name = "cir-research"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "transformers>=5.0,<6",
    "huggingface-hub>=1.0,<2",
    "safetensors",
    "hydra-core",
    "omegaconf",
    "numpy",
    "pillow",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires external checkpoint, dataset, GPU, or network resources",
]

[tool.ruff]
line-length = 100
