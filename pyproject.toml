[project]
name = "cir-research"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "hydra-core",
    "omegaconf",
    "numpy",
    "pillow",
    "tqdm",
    "transformers>=4.36,<5",
    "entmax==1.3",
    "einops>=0.7,<1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
