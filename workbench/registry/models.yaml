# Optional per-model environment field `interpreter_sha256`: the SHA-256 of the
# interpreter binary an operator pinned for that model. When present, a mismatch is
# refused as UNSAFE_INTERPRETER; absent or UNKNOWN means unpinned. Compute it with
# `sha256sum "$(readlink -f "$WORKBENCH_<MODEL>_PYTHON")"` after creating the
# environment from the upstream spec, and record it before a reproduction run.
schema_version: 1
protocols:
  fashioniq_original_split:
    label: FashionIQ - Original Split (Full Gallery, Reference Included)
    literature_split_label: original
    evaluation_noise_pct: 0
  fashioniq_full_gallery_ref_excluded:
    label: FashionIQ - Original Full Gallery, Reference Excluded
    literature_split_label: original
    evaluation_noise_pct: 0
  fashioniq_val_split:
    label: FashionIQ - Val Split (Pair-Union Gallery, Reference Excluded)
    literature_split_label: val
    evaluation_noise_pct: 0
models:
  - model_id: csmcir
    environment:
      python_env_var: WORKBENCH_CSMCIR_PYTHON
      confidence: VERIFIED_README
      python: '3.9'
      pytorch: '2.0.1'
      torchvision: '0.15.2'
      # The pinned evaluator hard-requires CUDA: utils_csmcir.py selects the cuda device whenever
      # torch sees one and blip_validate.py calls torch.cuda.empty_cache() (which raises without
      # CUDA). torch==2.0.1 from PyPI bundles the CUDA 11.7 runtime wheels, so 11.7 is the
      # declared requirement; an adapted sm_120 profile can override it per-model.
      cuda: '11.7'
      packages: []
    # The pinned evaluator derives its data root from `__file__` and opens
    # `<checkout>/fashionIQ_dataset`; the canonical root is staged there by the authorized
    # preparation step, and this declaration is what approves the link as a runtime artifact.
    canonical_dataset_link: fashionIQ_dataset
    method_name: CSMCIR
    research_generation: recent
    publication_year: null
    preparation_contract: manual_standard
    paper_title: "CSMCIR: CoT-Enhanced Symmetric Alignment with Memory Bank for Composed Image Retrieval"
    paper_url: https://arxiv.org/abs/2601.03728
    upstream_repo_url: https://github.com/qzp2018/CSMCIR
    upstream_default_branch: main
    upstream_commit_sha: 774f94e2076ff17ea91703a6239d2a08f0e1a44e
    source_available: true
    source_dir: CSMCIR
    fashioniq_layout: fashioniq_standard
    # The official release ships `.jpg` (its own README shows this), but this evaluator's image
    # path is hard-coded to `.png` (`src/data_utils_csmcir.py:FashionIQDataset.__getitem__`).
    # The preflight therefore requires the basenames to be present with this extension, so the
    # mismatch is reported on the laptop rather than as a missing-image failure on the GPU host.
    fashioniq_image_extensions: [".png"]
    literature_split_label: original
    native_protocol: fashioniq_original_split
    supported_protocols: [fashioniq_original_split]
    reported_r10: 57.07
    reported_r50: 77.27
    reported_mean: 67.17
    reproduction_status: NOT_RUN
    strict_clean_checkpoint_available: true
    # The pinned package cannot be imported, so no local preparation can make this model run.
    # `lavis/models/__init__.py` executes 98 unguarded imports for modules the author never committed,
    # before the line that registers the class this evaluator asks for, so the entrypoint fails during
    # import. See workbench/patches/csmcir.md. Reported by preflight ahead of the caption blockers,
    # which are real but downstream of this.
    # The pinned public revision cannot import its own evaluator: `src/lavis/models/__init__.py` runs 98
    # unguarded imports of modules the revision does not contain, before the line that registers the
    # class this model needs. One approved patch repairs exactly that, and the declaration below is
    # what makes a patched checkout an approved variant instead of an unauthorized source change.
    # Preflight reports the unpatched state as a blocker and accepts only the recorded derived digest.
    approved_source_patches:
      - path: src/lavis/models/__init__.py
        patch_file: workbench/patches/csmcir_models_init_compat.patch
        patch_sha256: 0e703584a7ecb5df3781574c2516fd406745c414491b6aa487fbb3e76532b9bd
        base_sha256: 9d8c914b551a7de614e062f9a241f44626fd591a31a0ccf1cc79f0ae23c9db01
        derived_sha256: aa68fe5e20bcda5e17d978799deb8ec0ff4636e5b3b2a6ef637ce5e385b0c818
        reason: "98 unguarded imports of modules absent from the pinned public revision prevent the package from importing, so the shipped CSMCIR class is never registered"
    source_blocker: "pinned lavis.models package cannot be imported as published (98 unguarded imports of absent modules sit before the registration); an approved patch is declared in approved_source_patches and removes only that blocker"
