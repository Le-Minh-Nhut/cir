      pytorch: '2.0.1'
      torchvision: '0.15.2'
      # The pinned evaluator hard-requires CUDA: utils_csmcir.py selects the cuda device whenever
      # torch sees one and blip_validate.py calls torch.cuda.empty_cache() (which raises without
      # CUDA). torch==2.0.1 from PyPI bundles the CUDA 11.7 runtime wheels, so 11.7 is the
      # declared requirement; an adapted sm_120 profile can override it per-model.
