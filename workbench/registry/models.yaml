      packages: [spacy==3.7.2, clip @ git+https://github.com/openai/CLIP.git@a1d071733d7111c9c014f024669f959182114e33, opencv-python-headless==4.5.5.64, fairscale==0.4.13, iopath==0.1.10, numpy, omegaconf==2.3.0, packaging, pandas==2.2.0, Pillow, pyyaml, regex, requests, tqdm, transformers==4.36.2, timm==0.9.12]
