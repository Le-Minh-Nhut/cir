          variant_id: vitl_backbone
          changes: "CLIP ViT-L/14 vision encoder instead of the paper's EVA-CLIP ViT-g/14"
          evidence: "upstream issue #4: the author acknowledges the paper reported ViT-L while the released code defaults to ViT-g, and published ViT-L weights as a separate variant"
          comparability: "NOT comparable to the registry's paper row (reported_r10/reported_r50 describe the ViT-g configuration); a result from this checkpoint must not be compared against it"
        notes: "ViT-L backbone (CLIP ViT-L/14), author-published as a variant after the paper's ViT-g code default was acknowledged in upstream issue #4. Reachable (HTTP 200, 1 459 756 541 bytes observed); no published checksum."

