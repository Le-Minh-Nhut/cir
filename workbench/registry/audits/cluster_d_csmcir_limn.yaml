    evaluation_data_flow: "LIMN evaluation uses category-specific whole-model checkpoints (0_{category}_best_model.pt) trained independently for dress, shirt, toptee (LIMN/train.py:263) and deserialized via PyTorch. FashionIQ dataset initialization (LIMN/datasets.py:38-65) checks for {category}_train_data.json and test_queries_{category}.pkl/test_targets_{category}.pkl caches at dataset root (which must end with a trailing slash for line 44 self.image_dir = self.path + 'resized_image'); if caches are absent, it generates them from split.{category}.val.json, cap.{category}.val.json, cap.{category}.train.json, bundled correction_dict_{category}.json, and pre-resized category images resized_image/{category}/{id}.jpg. The evaluation function test() (LIMN/test.py:23-97) extracts query and candidate image representations, normalizes features, masks source reference images from candidate pools (line 82), and computes rank recalls at 1, 10, and 50."
    unresolved:
