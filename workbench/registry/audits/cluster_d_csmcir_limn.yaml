    evaluation_data_flow: "src/validate_blip_csmcir.py:main() (line 515) calls blip_validate_fashioniq(), which initializes Blip2QformerCirAlignPromptCSMCIR with pretrained LAVIS base weights and BertTokenizer (src/lavis/models/blip2_models/blip2.py:32), then loads the fine-tuned checkpoint (line 570). It iterates over dress, toptee, shirt, instantiating FashionIQDataset in relative and classic modes (lines 596, 598); FashionIQDataset.__init__ (src/data_utils_csmcir.py:405, 408, 419) reads canonical captions/cap.{category}.val.json, image_splits/split.{category}.val.json, and qwen_captions/{category}_cot_val.json, while __getitem__ (line 468) reads flat images as .png. At line 612, extract_index_blip_caption_features (src/utils_csmcir.py:100-103) reads COT_ours2/fashioniq/{category}_cot_val.json to compute gallery index representations, after which generate_fiq_val_predictions (lines 177-199) computes query distances via blip_model.inference()."
    unresolved:
      - "COT_ours2/fashioniq/{dress,shirt,toptee}_cot_val.json is required by extract_index_blip_caption_features (src/utils_csmcir.py:100-103), but is absent from upstream GitHub and HuggingFace repositories; acquisition source is unverified."
      - "Image loading in FashionIQDataset.__getitem__ (src/data_utils_csmcir.py:468) hardcodes the .png extension, whereas standard FashionIQ distribution provides .jpg files."
      - "base_path in src/data_utils_csmcir.py:16 and src/utils_csmcir.py:18 resolves to <checkout_root> (workbench/third_party/CSMCIR), so fashionIQ_dataset must be a symlink or directory at the checkout root, and COT_ours2 must be placed at <checkout_root>/COT_ours2/."

