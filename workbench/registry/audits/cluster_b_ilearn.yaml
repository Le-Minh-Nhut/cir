    evaluation_data_flow: "Official FashionIQ evaluation is performed by calling test_BLIP2.py:test() from train_BLIP2.py:298 over categories dress, shirt, and toptee. In datasets.py:FashionIQ.get_test_data() (lines 181-224), validation captions are normalized with category correction dictionaries (captions/correction_dict_{category}.json) and concatenated with ' and '; images are loaded from resized_image/{category}/{id}.jpg with targetpad_transform(1.25, 224) (data_utils.py:92-106). Query features are encoded by model.extract_retrieval_compose() (lavis/models/blip2_models/blip2_cir.py:127-167) and gallery features by model.extract_retrieval_target() (lines 170-192), using base BLIP-2 weights (lavis/configs/models/blip2/blip2_pretrain.yaml:10) and the BERT tokenizer (blip2.py:32); dot-product similarity is masked at the reference index (-10e10) before ranking for R@1/10/50 (test_BLIP2.py:142-151). Eval path comparison: Differs from all siblings; AirKnow/test_BLIP2.py:10 leaves the model in model.train() during FashionIQ evaluation and wraps the function body in with torch.no_grad(): (line 11)."
    unresolved:
      - "No standalone evaluation entrypoint or CLI exists in AirKnow/test_BLIP2.py; test() is only callable as an internal training subroutine."
      - "No checkpoint loading routine exists to evaluate official author Hugging Face checkpoints (airknow_fiq_0.5.pt, airknow_fiq_0.8.pt); training script initializes a fresh model and saves best_model.pt."
      - "Official Hugging Face repository releases only 50% and 80% noise-trained weights; no clean (0% noise) trained checkpoint is published."
      - "Model is left in model.train() during FashionIQ validation in test_BLIP2.py:10."
      - "Hardcoded absolute path /root/bert-base-uncased in lavis/models/blip2_models/blip2.py:32,48,55."
      - "Missing provenance for captions/correction_dict_{dress,shirt,toptee}.json."

