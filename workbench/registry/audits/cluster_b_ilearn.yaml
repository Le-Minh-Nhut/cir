        expected_relative_path: .cache/lavis/blip2_pretrained.pth
        expected_format: pth
        expected_structure: "PyTorch checkpoint dict containing pretrained ViT-g visual encoder and Q-Former weights"
        classification: EXTERNAL_PRETRAINED_ASSET
        official_download_url: "https://storage.googleapis.com/sfr-vision-language-research/LAVIS/models/BLIP2/blip2_pretrained.pth"
        official_version_or_revision: null
        expected_sha256: null
