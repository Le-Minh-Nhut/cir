schema_version: 1
cluster: ilearn
notes: "Cluster B audit covering the iLearn-Lab BLIP-2 model family: AirKnow, ConeSep, HABIT, and INTENT. All four repositories share a common LAVIS BLIP-2 codebase lineage: data_utils.py is byte-identical across all four (SHA256 c6a90c6d7a57, 18058 bytes), utils.py is byte-identical across all four (SHA256 694a5081a6eb, 4576 bytes), blip2_pretrain.yaml is identical across all four pointing to Salesforce BLIP-2 pretrained weights, and blip2.py hardcodes /root/bert-base-uncased across all four. All four models share the same FashionIQ evaluation protocol (fashioniq_full_gallery_ref_excluded: full ordered validation split gallery with reference masked to -10e10 before ranking). None of the four provides a standalone FashionIQ evaluation CLI or checkpoint loader for their published Hugging Face checkpoints."

models:
