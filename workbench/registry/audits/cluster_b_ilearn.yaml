    eval_entrypoint: test_BLIP2.py
    eval_command_evidence: "AirKnow/train_BLIP2.py:298 — 't = test.test(args, model, trainset, category, txt_processors)' in train_and_evaluate(); invoked via 'python train_BLIP2.py --dataset fashioniq --fashioniq_path <path>/ ...' (AirKnow/README.md:205-213)"
    eval_path_comparison: "Differs from all siblings (ConeSep, HABIT, INTENT). In AirKnow/test_BLIP2.py:10, model.train() is called and the model is left in training mode throughout FashionIQ testing (ConeSep, HABIT, and INTENT all call model.eval()). AirKnow/test_BLIP2.py:11 wraps the entire function body in 'with torch.no_grad():'. AirKnow/test_BLIP2.py:12-79 contains fashion200k evaluation (present in HABIT and INTENT, absent in ConeSep). AirKnow/test_BLIP2.py:90-96,158-166 contains lasco and birds handling (absent in ConeSep). AirKnow/test_BLIP2.py:179-273 defines lasco_query, lasco_target, and test_lasco with empty string paths load_obj('') (absent in ConeSep and HABIT; present in INTENT with hardcoded /root/autodl-tmp/LaSCo/ paths). AirKnow/datasets.py is significantly expanded (44641 bytes vs ~17400 bytes in siblings) with FashionIQ_V, CIRR_V, LaSCo, Birds, Fashion200k classes and training noise label tracking in FashionIQ.__init__ (lines 64-65)."
