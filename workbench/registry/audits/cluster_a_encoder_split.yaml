    evaluation_data_flow: "Evaluation iterates over categories dress, shirt, and toptee (train.py:198). For each category, FashionIQ loads queries from captions/cap.{category}.val.json corrected with captions/correction_dict_{category}.json and target IDs from image_splits/split.{category}.val.json (datasets.py:133-152), fetching pre-resized JPEGs from resized_image/<category>/ (datasets.py:104, 115). TargetPad transform (data_utils.py:50-73) preprocesses images before BLIP-2 feature extraction via model.extract_retrieval_compose and model.extract_retrieval_target (test.py:45, 61). Dot product similarity ranking computes Recall@{1, 10, 50} excluding source reference images (test.py:74-108)."
    unresolved:
      - "test.py contains no __main__ CLI block and train.py contains no evaluation-only CLI flag (train.py:59 defines --restore_file but ignores it); running official evaluation without training requires wrapping test.test()."
      - "captions/correction_dict_{dress,shirt,toptee}.json is required by datasets.py:63, 137 but not bundled in HINT source; no download URL or generation script is provided in the repository."
      - "Blip2Base hardcodes '/root/bert-base-uncased' at blip2.py:32, 48, 54, requiring local bert-base-uncased weights or source patching."

