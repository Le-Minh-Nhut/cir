    evaluation_data_flow: "src/validate.py:main initializes frozen OpenAI CLIP RN50x4 via clip.load (src/validate.py:279) and loads the trained Combiner network state dict from --combiner-path under key 'Combiner' (src/validate.py:306-307). For each category (shirt, dress, toptee), fashioniq_val_retrieval reads validation annotations, split files, and JPEG images from <checkout>/fashionIQ_dataset (src/data_utils.py:11-176). Gallery features are extracted across the full split order using TargetPad(1.25, 288) (src/utils.py:extract_index_features); queries concatenate relative captions into 'cap0 and cap1' format (src/validate.py:88-93), tokenize with clip.tokenize, and fuse image and text embeddings via Combiner (src/validate.py:105-107). R@10 and R@50 are computed against the full gallery without reference exclusion (src/validate.py:44-57) and macro-averaged (src/validate.py:353-354)."
