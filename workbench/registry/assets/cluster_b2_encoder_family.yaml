schema_version: 1
cluster: b2_encoder_family
notes: "Cluster B2 audit covering the encoder/transformer CIR model family: HINT, ENCODER, PAIR, and TG-CIR. All four checkouts originate from iLearn-Lab (Shandong University / HIT Shenzhen). Investigation settles two upstream missing-module blockers (datasets1 in ENCODER and MHTransformer_rev in PAIR) with exhaustive local and remote commit-history audits, verifies FashionIQ evaluation entrypoint mechanics, maps external asset dependencies (OpenCLIP, OpenAI CLIP, BLIP-2 EVA-CLIP, BERT tokenizer, correction dictionaries, generated PKLs), and documents image directory and resize expectations."

models:
  - model_id: hint
    source_dir: HINT
    upstream_commit: bec50b6c8c19111893b617979502b948d1cea5b2
    eval_entrypoint: test.py:test
    eval_command_evidence: "train.py:199 — 't = test.test(args, model, trainset, category, txt_processors)' in train_and_evaluate(); invoked via 'python train.py --dataset fashioniq --fashioniq_path <path>/ ...' (HINT/README.md:183-191). Pinned test.py has no __main__ or CLI parser."
    evaluation_data_flow: "Evaluation is driven through train.py:199 inside train_and_evaluate(), looping over categories ['dress', 'shirt', 'toptee']. test.py:test (lines 10-159) consumes validation query triplets from captions/cap.{name}.val.json (datasets.py:133) and validation splits from image_splits/split.{name}.val.json (datasets.py:131). Images are loaded from resized_image/<category>/<image_name>.jpg via string concatenation self.path + 'resized_image' (datasets.py:29, 104) and preprocessed with targetpad_transform(crop_size=224, target_ratio=1.25) (train.py:76-80). Features are extracted using model.extract_retrieval_compose and model.extract_retrieval_target (test.py:39, 52), reference image scores are masked with -10e10, and Recall@10/Recall@50 are evaluated across the full validation gallery split."
    assets:
      - logical_asset_id: hint_blip2_pretrained_weights
        asset_role: backbone_weights
        required_for_evaluation: true
        upstream_source_file: lavis/configs/models/blip2/blip2_pretrain.yaml
        upstream_line: 10
        upstream_function: BaseModel.load_checkpoint_from_config
        expected_relative_path: .cache/lavis/blip2_pretrained.pth
        expected_format: pth
        expected_structure: "PyTorch checkpoint dict containing pretrained ViT-g visual encoder and Q-Former weights"
        classification: EXTERNAL_PRETRAINED_ASSET
        official_download_url: "https://storage.googleapis.com/sfr-vision-language-research/LAVIS/models/BLIP2/blip2_pretrained.pth"
        official_version_or_revision: null
        expected_sha256: null
        expected_size_bytes: null
        generation_script: null
        generation_parameters: null
        raw_input_dependencies: []
        output_validation_contract: "PyTorch state_dict loadable with keys matching EVA-CLIP visual encoder and BertLMHeadModel Q-Former"
        acquisition_status: AVAILABLE
