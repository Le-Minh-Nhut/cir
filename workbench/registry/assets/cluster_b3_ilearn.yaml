schema_version: 1
cluster: b3_ilearn
models:
  - model_id: airknow
    source_dir: AirKnow
    upstream_commit: 6ab6fa95b746f85b08eea4cb66eb51448bce99b7
    eval_entrypoint: test_BLIP2.py
    eval_command_evidence: "AirKnow/train_BLIP2.py:298 — 't = test.test(args, model, trainset, category, txt_processors)' in train_and_evaluate(); invoked via 'python train_BLIP2.py --dataset fashioniq --fashioniq_path <path>/ ...' (AirKnow/README.md:205-213)"
    shared_with:
      byte_identical_files:
        - file: data_utils.py
          siblings: [conesep, habit, intent]
          sha256: c6a90c6d7a57a8bf6ff00874ff0b497042a98f121d5c21f7dbbe03ec417430d8
          size_bytes: 18058
          lines: 427
          evidence: "Byte-identical across all four checkouts; implements TargetPad and targetpad_transform(1.25, 224) (lines 92-106)."
        - file: utils.py
          siblings: [conesep, habit, intent]
          sha256: 694a5081a6eb6408d66e746a5d42188ff6e6cf1e4a5bf4d289aa841ee135cf50
          size_bytes: 4576
          lines: 145
          evidence: "Byte-identical across all four checkouts; implements Params, RunningAverage, set_logger."
        - file: lavis/configs/models/blip2/blip2_pretrain.yaml
          siblings: [conesep, habit, intent]
          evidence: "Identical 38 lines; configures Salesforce BLIP-2 pretrained weights at line 10."
      fork_diff_evidence:
        - "AirKnow/test_BLIP2.py:10 calls model.train() leaving the model in training mode during validation, whereas ConeSep, HABIT, and INTENT call model.eval()."
        - "AirKnow/test_BLIP2.py:11 indents the entire function body in 'with torch.no_grad():'."
        - "AirKnow/test_BLIP2.py:12-79 contains fashion200k testing (present in HABIT and INTENT, absent in ConeSep)."
        - "AirKnow/test_BLIP2.py:90-96,158-166 contains lasco and birds handling (absent in ConeSep)."
        - "AirKnow/test_BLIP2.py:179-273 defines lasco helper functions with empty string paths load_obj('') (INTENT hardcodes /root/autodl-tmp/LaSCo/)."
        - "AirKnow/datasets.py contains 1041 lines including FashionIQ_V, CIRR_V, LaSCo, Birds, and Fashion200k classes (absent in ConeSep, HABIT, INTENT)."
        - "AirKnow/lavis/models/blip2_models/blip2.py lines 102-103 adds 'if Qformer.cls.predictions.bias in state_dict: del state_dict[Qformer.cls.predictions.bias]' (absent in ConeSep, HABIT, INTENT)."
        - "AirKnow/lavis/models/eva_vit.py line 443 defines URL (ConeSep, HABIT, INTENT define it at line 442)."
    evaluation_data_flow: "Evaluation runs via test_BLIP2.py:test() called from train_BLIP2.py:298 over categories dress, shirt, toptee. In datasets.py:FashionIQ.get_test_data() (lines 181-224), captions are normalized via captions/correction_dict_{category}.json and joined with ' and '; images are loaded from resized_image/{category}/{id}.jpg with targetpad_transform(1.25, 224) (data_utils.py:92-106). Query and gallery features are extracted by model.extract_retrieval_compose() and extract_retrieval_target() (lavis/models/blip2_models/blip2_cir.py:127-192), using BLIP-2 pretrained weights (blip2_pretrain.yaml:10) and /root/bert-base-uncased (blip2.py:32). Dot-product similarity masks reference index to -10e10 before ranking."
    search_locations_checked:
      - workbench/third_party/AirKnow/README.md
      - workbench/third_party/AirKnow/test_BLIP2.py
      - workbench/third_party/AirKnow/train_BLIP2.py
      - workbench/third_party/AirKnow/datasets.py
      - workbench/third_party/AirKnow/data_utils.py
      - workbench/third_party/AirKnow/utils.py
      - workbench/third_party/AirKnow/lavis/configs/models/blip2/blip2_pretrain.yaml
      - workbench/third_party/AirKnow/lavis/models/blip2_models/blip2.py
      - workbench/third_party/AirKnow/lavis/models/blip2_models/blip2_cir.py
      - workbench/third_party/AirKnow/lavis/models/eva_vit.py
      - workbench/registry/models.yaml
    unresolved:
      - "test_BLIP2.py lacks a __main__ entrypoint; evaluation only runs as an internal training subroutine from train_BLIP2.py:298."
      - "train_BLIP2.py defines --restore_file at line 67 but never implements loading weights from it."
      - "No clean (0% noise) trained checkpoint exists or is published upstream; only 50% and 80% noise checkpoints are available on Hugging Face."
      - "AirKnow/test_BLIP2.py:10 leaves the model in model.train() during evaluation."
      - "lavis/models/blip2_models/blip2.py hardcodes absolute host path /root/bert-base-uncased at lines 32, 48, and 55."
      - "Correction dictionaries (captions/correction_dict_{dress,shirt,toptee}.json) are missing from the checkout with no download URL or generator."
