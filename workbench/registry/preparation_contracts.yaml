- preparation_id: tme_fashioniq
  source_family: TME (CVPR25) FashionIQ validation
  raw_inputs:
  - name: FashionIQ validation captions, splits, and canonical images
    kind: raw_benchmark
    scope: fashioniq_root
    paths:
    # `images` is declared because generation CONSUMES it. TME's own preprocess
    # (`targetpad_transform(target_ratio=1.25, dim=224)`, `src/precompute.py:23`) expects the
    # canonical dataset images, and the wrapper binds them into the flat `images/<id>.jpg` view the
    # native loader opens. The earlier declaration omitted `images` while the wrapper actually
    # consumed a DIFFERENT family's generated `resized_image/` tree -- an undeclared dependency on
    # another model's artifact, which also meant a TME-only selection could not run at all.
    - images
    - captions/cap.dress.val.json
    - captions/cap.shirt.val.json
    - captions/cap.toptee.val.json
    - image_splits/split.dress.val.json
    - image_splits/split.shirt.val.json
    - image_splits/split.toptee.val.json
  generated_artifacts:
  - name: native FashionIQ validation image features
    kind: generated_repo_artifact
    # NOT `fashioniq_root`: the native loader opens `./features/FashionIQ/...` relative to the
    # EVALUATOR's working directory, and the wrapper chdirs to the checkout. Declaring it under the
    # dataset root made the shared preflight inspect a path the run never opens, so a missing native
    # input passed readiness. `cwd: evaluator` records that the path is checkout-relative.
    scope: evaluator_cwd
    paths:
    - features/FashionIQ
    generator: tme_precompute_features
    cwd: evaluator
    parameters:
      source_script: src/precompute.py
      eval_dataset: FashionIQ
      batch_size: 512
      # The pinned 512 is the author's own value and stays the default. It is also an OPERATIONAL
      # setting rather than a preprocessing semantic: it only decides how many gallery images share
      # one forward pass, and therefore whether the job fits the card at all. `workers` is
      # deliberately NOT overridable -- the native loader runs in this process either way.
      #
      # MEASURED, not estimated, on an RTX 3050 Laptop with 4096 MiB (3768 MiB visible to torch):
      # 512 OOMs, 128 OOMs, 80 OOMs, 72 completes at 4.0 GiB peak with the EVA tower in fp16.
      # 32 is the operating value: it costs ~14 minutes for the 15536-image val gallery at
      # ~13.5 images/s and holds a wide margin on a 4 GiB card.
      #
      # The resolved batch is written into the receipt and compared on reuse, so a cache can never be
      # silently reused under a different batch than produced it.
      batch_size_override_env_var: WORKBENCH_TME_BATCH_SIZE
      workers: 8
      receipt_filename: .workbench_tme_precompute_receipt.json
      source_evidence: >-
        the pinned `data.py:250-255` `load_image_features()` opens
        `./features/FashionIQ/<split>_images.pt` and `./features/FashionIQ/<split>_name_to_idx.json`
        relative to the evaluator's working directory, and `src/precompute.py` is the pinned script
        that writes exactly those two files; the wrapper generates them through the same native path
        rather than reimplementing the transform
      split: val
      layout: fashioniq_val_split_file_order
      # The native `vit_encode` output for this backbone: 257 tokens (CLS + 256 patches) x 1408
      # channels, float32. Declared so the required cache size is DERIVED (gallery image count from
      # the ordered split JSON, times tokens x width x dtype) instead of hard-coded, and so the
      # derived figure stays true if the split or the backbone changes.
      tokens_per_image: 257
      feature_width: 1408
      # fp16, not float32: the pinned precompute wraps `vit_encode` in `torch.cuda.amp.autocast()` and
      # `create_eva_vit_g` runs `convert_weights_to_fp16(model)` under its default `precision="fp16"`
      # (`eva_vit.py:426-455`), then saves `images_embes.cpu()` with no dtype conversion. A float32
      # declaration would have OVERSTATED the requirement by 2x (20.94 GiB instead of a 10.47 GiB lower
      # bound) from the metadata alone, which is the kind of error that makes an operator free a disk
      # they did not have to.
      feature_dtype: float16
  external_assets:
  - name: BLIP-2 pretrain weights
    kind: model_weight
    state: REQUIRED
    # REQUIRED. An earlier revision of this entry marked it not-required on the reasoning that
    # `load_from_pretrained` is unreachable; that reasoning was WRONG and is recorded here so it is
    # not re-derived. The pinned `blip2_pretrain.yaml` sets `load_finetuned: False` AND declares
    # `pretrained: <blip2_pretrained.pth URL>`, so `load_checkpoint_from_config` (`base_model.py:89-102`)
    # takes its `load_pretrained` branch and really does call `load_from_pretrained`, whose body
    # (`blip2.py:87-89`) redirects that URL to the local `torch.load('weight/blip2_pretrained.pth')`.
    # The broken author assert on the same path never runs, because the guard is false.
    #
    # The earlier empirical check was MISREAD, not wrong in itself: constructing the model with no
    # base weights present fails FIRST at `weight/eva_vit_g.pth`, because `create_eva_vit_g` runs
    # inside `init_vision_encoder` before the pretrained load. Dying at the EVA file therefore never
    # demonstrated that the BLIP-2 file is unused - it only demonstrated that EVA is read earlier.
    required_for_evaluation: true
    required_for_preparation: false
    # The same redirect names a literal cwd-relative path, and the wrapper chdirs to the checkout, so
    # this artifact also has exactly one valid location: `weight/blip2_pretrained.pth` INSIDE that
    # checkout. The declaration is the evaluator-relative path because that is the path the loader
    # opens and the path the asset checker now resolves; declaring it repository-relative
    # (`third_party/TME/weight/...`) made the checker look one directory above the loader's file, so a
    # correctly staged asset was reported missing.
    expected_local_location: weight/blip2_pretrained.pth
    location_env_var: null
    expected_sha256: null
    # Observed on the live object with a HEAD request this round.
    expected_size_bytes: 746998955
    source: https://storage.googleapis.com/sfr-vision-language-research/LAVIS/models/BLIP2/blip2_pretrained.pth
    optional: false
    notes: >-
      Staged as `weight/blip2_pretrained.pth` under the TME checkout, the path the pinned
      `load_from_pretrained` redirect opens, next to `weight/eva_vit_g.pth` which the constructor
      reads slightly earlier.
  - name: EVA-ViT-g backbone weights
    kind: model_weight
    state: REQUIRED
    required_for_evaluation: true
    required_for_preparation: false
    # The native constructor opens this file by a literal cwd-relative path
    # (`eva_vit.py:446`: `torch.load('weight/eva_vit_g.pth', ...)`) and the wrapper chdirs to the
    # checkout, so the artifact has exactly ONE valid location: `weight/eva_vit_g.pth` inside that
    # checkout. Declaring the path — rather than accepting any file the operator names — is what makes
    # preflight check the file the loader actually opens instead of a file that merely exists
    # somewhere.
    expected_local_location: weight/eva_vit_g.pth
    location_env_var: null
    expected_sha256: null
    # Same source of truth as the BLIP-2 row above: the object's own HEAD response.
    expected_size_bytes: 2025249237
    source: https://storage.googleapis.com/sfr-vision-language-research/LAVIS/models/BLIP2/eva_vit_g.pth
    optional: false
    notes: >-
      Genuinely required and genuinely file-only: `create_eva_vit_g` (`eva_vit.py:446`) executes
      `torch.load('weight/eva_vit_g.pth', ...)` directly in the constructor with the upstream URL
      commented out, so no implicit downloader can supply it. This is the file the model constructor
      dies on when absent (verified by running the constructor), which is why it is staged under the
      evaluator's cwd as `weight/eva_vit_g.pth`.
  - name: bert-base-uncased tokenizer
    kind: tokenizer
    state: REQUIRED
    # The name is also the KEY this asset takes inside the TME precompute receipt's `base_assets`
    # map, so it deliberately stays as recorded: renaming it would invalidate a valid 10.47 GiB
    # feature cache for a labelling reason, without any feature input having changed.
    #
    # REQUIRED, and the reason is the constructor chain rather than the vocabulary alone: the pinned
    # TME `src/precompute.py:19` calls `load_model_and_preprocess(...)`, which builds the model, and
    # that construction reaches `blip2.py::init_tokenizer` (BertTokenizer), `init_Qformer`'s
    # `BertConfig.from_pretrained("bert-base-uncased")` AND its vendored
    # `BertLMHeadModel.from_pretrained("bert-base-uncased", config=encoder_config)`. A cache with a
    # valid vocabulary and config and no model weights passes a tokenizer-only check and then dies in
    # the Qformer loader, which is why the model payload is part of this declaration and not a
    # separate optional one.
    required_for_evaluation: true
    # The same call is on `precompute.py`'s path, so it is a PREPARATION input too. Declaring it false
    # made the DAG free to schedule feature generation before this cache existed.
    required_for_preparation: true
    expected_local_location: null
    location_env_var: HF_HOME
    # A DIRECTORY: the hub stores the repo as a cache directory, and `from_pretrained` needs that
    # directory rather than one file inside it.
    location_type: directory
    cache_path_suffix: hub/models--bert-base-uncased
    cache_root_env_var: HF_HOME
    # Resolved under `HF_HOME` (default `~/.cache/huggingface`), NOT under the torch cache: the pinned
    # code loads it through `from_pretrained("bert-base-uncased")`, which reads the Hugging Face hub
    # cache. The hub's own layout requires `refs/<revision>` to point at `snapshots/<revision>/`;
    # the auxiliary registry declares the acquisition and the published payload size.
    expected_sha256: null
    source: https://huggingface.co/bert-base-uncased
    source_revision: 86b5e0934494bd15c9632b12f734a8a67f723594
    optional: false
    notes: >-
      A Hugging Face hub cache directory rather than a checkpoint-sized artifact. The pinned loader
      resolves the repo id to `hub/models--bert-base-uncased/` and reads the active revision from
      `refs/`, so the checker requires a revision ref and a snapshot with model payload, and the
      model interpreter load-tests it offline.
  deterministic_status: UNKNOWN
