- model_id: csmcir
  family: bert-base-uncased tokenizer
  required_for: official_evaluation
  source_type: author_huggingface
  source_repo: https://huggingface.co/bert-base-uncased
  source_revision: 86b5e0934494bd15c9632b12f734a8a67f723594
  source_path: config.json
  # A Hugging Face HUB asset: the destination is the repo cache directory the loader resolves from
  # the repo id (`hub/models--bert-base-uncased`), and the files under it are what acquisition,
  # verification and the budget all act on. Two corrections to the shape that preceded this one, both
  # reproduced: the destination was a FILE inside the repo directory (`hub/models--<repo>/config.json`
  # as a scalar path), which cannot express a repo whose payload is a set; and `expected_size_bytes`
  # was `570`, the size of that one JSON file, which UNDERSTATED an acquisition whose `hub_files`
  # include the 420 MiB model payload. A budget computed from that pair would have passed a run whose
  # transfer it did not cover.
  destination_scope: user_cache
  destination_path: hub/models--bert-base-uncased
  cache_root_env_var: HF_HOME
  hub_repo_id: bert-base-uncased
  hub_files: [config.json, pytorch_model.bin, tokenizer.json, tokenizer_config.json, vocab.txt]
  automatic_download_available: true
  # The published total of `hub_files`: 570 + 440473133 + 466062 + 48 + 231508. No per-file digest is
  # published for a plain JSON file, and the payload is an LFS object whose digest the hub publishes
  # in its own metadata rather than here.
  expected_size_bytes: 441171321
  expected_sha256: null
  provenance_status: VERIFIED
