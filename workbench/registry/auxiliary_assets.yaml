- model_id: combiner_rn50x4_noft
  family: OpenAI CLIP RN50x4 base weights
  required_for: official_evaluation
  source_type: direct_url
  source_repo: https://openaipublic.azureedge.net/clip/models/7e526bd135e493cef0776de27d5f42653e6b4c8bf9e0f653bb11773263205fdd/RN50x4.pt
  source_revision: null
  source_path: null
  destination_scope: user_cache
  destination_path: RN50x4.pt
  # OpenAI's CLIP does NOT read XDG_CACHE_HOME: `clip.load` resolves its cache as
  # `download_root or os.path.expanduser("~/.cache/clip")` (openai/CLIP clip/clip.py:120). The
  # registry must match the consumer, so this root is fixed rather than environment-driven.
  cache_root_fixed: ~/.cache/clip
  cache_root_env_var: XDG_CACHE_HOME
  automatic_download_available: true
  # The digest is OpenAI's own URL-convention hash of the RN50x4 weights; upstream CLIP
  # self-verifies against it. expected_size_bytes is the content-length the CDN served (final
  # audit M-6, HEAD observed); the bytes were not downloaded, so VERIFIED covers URL + published
  # digest, not a hash of bytes on disk.
  expected_size_bytes: 421854225
  expected_sha256: 7e526bd135e493cef0776de27d5f42653e6b4c8bf9e0f653bb11773263205fdd
  provenance_status: VERIFIED
