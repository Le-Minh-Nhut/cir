- model_id: csmcir
  family: COT_ours2 captions
  required_for: official_evaluation
  # SOURCE_COMPATIBLE_EQUIVALENCE_UNKNOWN (workbench/docs/COT_OURS2_AUDIT.md).
  # The author never published `COT_ours2/fashioniq/*`, and no copy is reachable, so the strict
  # requirement stays UNVERIFIED and csmcir stays blocked by default. The published Qwen caption of
  # the same category and split is a source-compatible stand-in: it is the file the author ships, its
  # gallery-id coverage is exact against the declared split, and it carries the `Final_Caption` every
  # executing consumer reads. `caption_alias_from` names that published asset so an explicitly
  # opted-in run can stage it at this path, labelled as a variant rather than as official parity.
  source_type: none
  source_repo: null
  source_revision: null
  source_path: null
