- model_id: tme
  family: bert-base-uncased Qformer payload
  required_for: official_evaluation
  source_type: author_huggingface
  source_repo: https://huggingface.co/bert-base-uncased
  source_revision: 86b5e0934494bd15c9632b12f734a8a67f723594
  source_path: config.json
  # The vocabulary is NOT the whole dependency. The pinned TME constructor chain reaches
  # `blip2_qformer_cir_image_diff_features.py:48,59` -> `blip2.py::init_tokenizer` (BertTokenizer) and
  # `blip2.py::init_Qformer`, whose body calls BOTH `BertConfig.from_pretrained("bert-base-uncased")`
  # AND the vendored `BertLMHeadModel.from_pretrained("bert-base-uncased", config=encoder_config)`.
  # A cache with valid vocabulary and config but no model weights passes a tokenizer-only check and
  # then fails in the Qformer loader, so the model payload belongs in the same declaration.
  #
  # `hub_files` is the published set those three calls need, and `expected_size_bytes` is their
  # published total: 570 + 440473133 + 466062 + 48 + 231508. Acquisition is bounded to that set.
  destination_scope: user_cache
  destination_path: hub/models--bert-base-uncased/config.json
  cache_root_env_var: HF_HOME
  hub_repo_id: bert-base-uncased
  hub_files: [config.json, pytorch_model.bin, tokenizer.json, tokenizer_config.json, vocab.txt]
  automatic_download_available: true
  expected_size_bytes: 441171321
  expected_sha256: null
  provenance_status: VERIFIED
