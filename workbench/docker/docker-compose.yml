# CIR Failure Analysis Workbench — single-service deployment.
# One container serves backend (uvicorn) + built frontend (vite preview proxy).
#
# GPU evaluation on Blackwell (RTX 5070 Ti, sm_120): start with WORKBENCH_ENABLE_GPU=1 so
# run.sh adds the docker-compose.gpu.yml override after nvidia-container-toolkit is installed.
# Docker's GPU passthrough is environmental — the workbench never fakes a GPU result; if the
# container cannot see the device, guarded runs stay blocked and say so (fail closed).
#
# Volume conventions (see .env.example): HOST_* values are resolved FROM THIS DIRECTORY
# (workbench/docker), so the checked-in defaults use ../.. to reach the repository root.
# Override any of them with an absolute path in .env.
services:
  workbench:
    build:
      context: ../..
      dockerfile: workbench/docker/Dockerfile
      # The code inside the image, named. `pc.sh` reuses a running container on a config match, and
      # without this the reused container could be the PREVIOUS commit's code while the report it
      # signs names the current one. `run.sh` supplies the value; an empty label means "unknown",
      # which the launcher treats as a mismatch rather than as agreement.
      labels:
        cir.commit: "${CIR_IMAGE_COMMIT:-unknown}"
    container_name: cir-workbench
    # Run as the invoking operator's uid/gid (default 1000:1000) so files the container
    # writes into host bind mounts (artifacts, checkpoints, results) are owned by the
    # operator, not by root. Override with WORKBENCH_UID/WORKBENCH_GID in .env when the
    # invoking account differs.
    user: "${WORKBENCH_UID:-1000}:${WORKBENCH_GID:-1000}"
    ports:
      - "${WORKBENCH_BACKEND_PORT:-8000}:8000"
      - "${WORKBENCH_FRONTEND_PORT:-5173}:5173"
    env_file:
      - .env
    environment:
      # The container ALWAYS listens on 8000 internally; WORKBENCH_BACKEND_PORT in .env is
      # host-side only. Override the env_file value so the backend listen port and the
      # frontend proxy target can never drift apart.
      WORKBENCH_BACKEND_PORT: "8000"
      WORKBENCH_BACKEND_URL: "http://127.0.0.1:8000"
      # WORKBENCH_RUNTIME_ADAPTATION: pass through from .env (empty by default).
      WORKBENCH_RUNTIME_ADAPTATION: "${WORKBENCH_RUNTIME_ADAPTATION:-}"
      # The evidence-ledger HMAC key lives under the operator config home. The container runs
      # as a non-root uid with no writable home directory, so point XDG_CONFIG_HOME at the
      # artifacts bind mount: key creation and the ledger key lock need a writable parent,
      # and a key under the artifacts mount is on the same volume the ledger itself lives on.
      XDG_CONFIG_HOME: /artifacts/config
    volumes:
      # DATA-02 three-way dataset separation, expressed as mounts:
      # - canonical raw `images/` and `image_splits/` are READ-ONLY submounts: preparation and
      #   evaluation physically cannot overwrite, delete or replace the benchmark inputs.
      # - the dataset root itself is writable so declared derived artifacts (resized images,
      #   staged correction dictionaries, native evaluator caches) can be generated beside the
      #   canonical files without ever touching them.
      - ${HOST_FASHIONIQ_ROOT:?set HOST_FASHIONIQ_ROOT in .env}:/data/FashionIQ
      - ${HOST_FASHIONIQ_ROOT:?set HOST_FASHIONIQ_ROOT in .env}/images:/data/FashionIQ/images:ro
      - ${HOST_FASHIONIQ_ROOT:?set HOST_FASHIONIQ_ROOT in .env}/image_splits:/data/FashionIQ/image_splits:ro
      # Model source checkouts, synced by the pipeline inside the container.
      - ${HOST_WORKBENCH_THIRD_PARTY_ROOT:?set HOST_WORKBENCH_THIRD_PARTY_ROOT in .env}:/third_party
      # Downloaded weights (large; keep on a real disk, not a named volume by default).
      - ${HOST_WORKBENCH_CHECKPOINT_ROOT:?set HOST_WORKBENCH_CHECKPOINT_ROOT in .env}:/checkpoints
      # Everything the workbench itself writes: index, runs, reports.
      - ${HOST_WORKBENCH_ARTIFACTS_ROOT:?set HOST_WORKBENCH_ARTIFACTS_ROOT in .env}:/artifacts
      - ${HOST_WORKBENCH_RESULTS_ROOT:?set HOST_WORKBENCH_RESULTS_ROOT in .env}:/results
    restart: unless-stopped
