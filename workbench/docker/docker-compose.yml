# CIR Failure Analysis Workbench — single-service deployment.
# One container serves backend (uvicorn) + built frontend (vite preview proxy).
#
# GPU evaluation on Blackwell (RTX 5070 Ti, sm_120): enable the `deploy.resources` block after
# nvidia-container-toolkit is installed on the host. Docker's GPU passthrough is environmental —
# the workbench never fakes a GPU result; if the container cannot see the device, runs stay
# GPU_VERIFICATION_PENDING and say so.
services:
  workbench:
    build:
      context: ../..
      dockerfile: workbench/docker/Dockerfile
    container_name: cir-workbench
    ports:
      - "${WORKBENCH_BACKEND_PORT:-8000}:8000"
      - "${WORKBENCH_FRONTEND_PORT:-5173}:5173"
    env_file:
      - .env
    environment:
      # The container ALWAYS listens on 8000 internally; WORKBENCH_BACKEND_PORT in .env is
      # host-side only. Override the env_file value so the backend listen port and the
      # frontend proxy target can never drift apart.
      WORKBENCH_BACKEND_PORT: "8000"
      WORKBENCH_BACKEND_URL: "http://127.0.0.1:8000"
      # Host-side port remapping stays host-side; the frontend inside the container talks
      # to the backend over loopback, never through the published port.
      # WORKBENCH_RUNTIME_ADAPTATION: pass through from .env (empty by default).
      WORKBENCH_RUNTIME_ADAPTATION: "${WORKBENCH_RUNTIME_ADAPTATION:-}"
    volumes:
      # Read-only research inputs.
      - ${HOST_FASHIONIQ_ROOT:-../data/FashionIQ}:/data/FashionIQ:ro
      # Model source checkouts, synced by sync_upstreams on the host.
      - ${HOST_WORKBENCH_THIRD_PARTY_ROOT:-../workbench/third_party}:/third_party
      # Downloaded weights (large; keep on a real disk, not a named volume by default).
      - ${HOST_WORKBENCH_CHECKPOINT_ROOT:-../workbench/artifacts/checkpoints}:/checkpoints
      # Everything the workbench itself writes: index, runs, reports.
      - ${HOST_WORKBENCH_ARTIFACTS_ROOT:-../workbench/artifacts}:/artifacts
      - ${HOST_WORKBENCH_RESULTS_ROOT:-../workbench/artifacts/results}:/results
    # Uncomment after nvidia-container-toolkit is installed on the host:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped
