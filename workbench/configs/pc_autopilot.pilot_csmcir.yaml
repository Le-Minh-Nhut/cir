# CSMCIR under the strict clean checkpoint policy -- retained for reference, NOT the first pilot.
#
# Superseded: use `pc_autopilot.pilot_limn.yaml` for the first GPU experiment.
#
# CSMCIR cannot run from its pinned source as published. Its registered entrypoint
# (src/validate_blip_csmcir.py) imports lavis.models, whose __init__ executes 98 unguarded imports at
# lines 44-151 for modules the author never committed, before the line that registers
# Blip2QformerCirAlignPromptCSMCIR (line 152). The package raises ModuleNotFoundError during import,
# and because the failing lines precede the registration, the model name would never resolve even if
# the import were bypassed. Reproduced against the public revision at
# 774f94e2076ff17ea91703a6239d2a08f0e1a44e; see workbench/patches/csmcir.md for the one-line fix and
# the verification to run after applying it.
#
# Independently of that, CSMCIR's official FashionIQ path needs COT_ours2/fashioniq/{category}_cot_val.json.
# That requirement is real and was re-verified from the pinned source: blip_validate_fashioniq calls
# extract_index_blip_caption_features (src/validate_blip_csmcir.py:618), which reads those files
# unconditionally for any FashionIQDataset (src/utils_csmcir.py:100) and feeds them into
# blip_model.extract_target_caption_features, so they drive the gallery features that decide
# Recall@10/@50. The author publishes qwen_captions but not COT_ours2, on either the GitHub or the
# Hugging Face repository, so that file must come from the operator. See the note below on how the
# two caption families differ.
#
# When copied outside the repository, every entry under `paths` that is not absolute is resolved
# relative to this config file's own directory, so all six `paths` keys must be absolute.
#
# Create the ledger signing key ONCE, keep it, and reuse it for every run of this workbench:
# the key signs the evidence ledger, so a new key each shell makes every earlier run unverifiable.
# The key lives under $XDG_CONFIG_HOME/cir/ (default ~/.config/cir/):
#   umask 077 && mkdir -p "${XDG_CONFIG_HOME:-$HOME/.config}/cir"
#   python -c "import os,pathlib,secrets; (pathlib.Path(os.environ.get('XDG_CONFIG_HOME') or pathlib.Path.home()/'.config')/'cir'/'workbench_ledger_key').write_text(secrets.token_hex(32))"
# Then, in each shell that runs the workbench:
#   export WORKBENCH_LEDGER_KEY="$(cat "${XDG_CONFIG_HOME:-$HOME/.config}/cir/workbench_ledger_key")"
# Omitting the variable entirely is also safe: a 0600 key file is created under $XDG_CONFIG_HOME/cir/
# on first use and reused thereafter. An empty key, or a missing key with an existing ledger, fails closed.
#
# Run command:
#   ./workbench/run.sh autopilot --config <this file> --apply --resume

schema_version: 1
selected_models:
  - csmcir

# Only weights whose recorded training condition is exactly 0. This is the default, and it is
# stated explicitly because this profile is meant to be read as a strict-clean experiment.
checkpoint_policy: strict_clean
checkpoint_overrides: {}

paths:
  registry: ../registry/models.yaml
  # The FashionIQ root itself: the directory containing captions/, image_splits/, images/.
  dataset_root: ../../data/FashionIQ
  # Generated state: run directories, evidence ledger, completion proofs, reports, GPU capability
  # records, environment prefixes, the derived index. Keep it on persistent storage.
  artifacts: ../artifacts
  checkpoints: ../artifacts/checkpoints
  results: ../artifacts/results
  third_party: ../third_party

budgets:
  # 10 GiB. CSMCIR's single checkpoint is far smaller; the margin covers the auxiliary captions and
  # leaves room for the LIMN bundle (5,376,030,471 bytes across three files) without re-editing.
  max_download_bytes: 10737418240
  max_models: 4
  top_k: 200

permissions:
  allow_network: true
  allow_large_downloads: true
  # allow_env_install: true authorizes conda environment creation and package installation
  # for the selected model group on cold-start. Pinned requirements are installed into a dedicated prefix.
  allow_env_install: true
  allow_preparation: true
  allow_gpu_eval: true
  allow_index_write: true
