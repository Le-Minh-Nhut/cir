# First GPU pilot: LIMN base iteration 0 under the include-flagged policy.
#
# Why LIMN rather than CSMCIR. Re-evaluated against the pinned source, not against an older report:
#
#   CSMCIR   BLOCKED at the source. Its registered entrypoint (src/validate_blip_csmcir.py) imports
#            lavis.models, whose __init__ runs 98 unguarded imports (lines 44-151) for modules the
#            author never committed, before the line that registers Blip2QformerCirAlignPromptCSMCIR
#            (line 152). The package therefore raises ModuleNotFoundError during import, and even if
#            that were bypassed the model name would never register, so
#            load_model_and_preprocess(name="blip2_cir_align_prompt_csmcir") cannot resolve. Reproduced
#            against the public revision. See workbench/patches/csmcir.md. CSMCIR additionally needs
#            COT_ours2 captions the author never published.
#
#   LIMN     Runnable. Three category checkpoints, each with a downloaded size and a sha256 that this
#            workbench verified against the author repository's own LFS pointer metadata:
#              0_dress_best_model.pt   1792010157  96a335d4eb8b1e77d35575aab9177637208e2eb6c59e12f833f67e5cb0e7fc1c
#              0_shirt_best_model.pt   1792010157  9260c7f77d3017d8cc10e6652cc8cfe275dbc9704366fa2bf581a24808930d74
#              0_toptee_best_model.pt  1792010157  79f663a14d89d455fdc3612b0b36d011c06d7957d1475a654755e1053a6cece2
#            Its resized images are generated by the workbench from the canonical images using the
#            documented FashionIQ resize recipe, its correction dictionaries ship in the pinned
#            checkout (correct_files/correction_dict_{dress,shirt,toptee}.json) and are staged rather
#            than re-derived, and its evaluator is driven by a reviewable native replay
#            (workbench/replay/limn.py) instead of by inventing a command for a script that has none.
#
# Two facts the operator should read before starting.
#
# 1. `checkpoint_policy: include_flagged_conditions` is REQUIRED. LIMN's upstream repository does not
#    publish a training-condition label for its checkpoints, so the registry records
#    `checkpoint_training_noise_pct: null` and the strict-clean policy refuses them. This is a
#    metadata gap, not evidence that the weights were trained on noisy data. Any reported number from
#    this run must be labelled as "training condition not published by the author" -- it is NOT a
#    verified 0%-training-noise checkpoint.
#
# 2. LIMN calls .cuda() unconditionally (LIMN/test.py:39), so this pilot needs a working CUDA device.
#    It will report BLOCKED_GPU rather than silently falling back to CPU.
#
# When copied outside the repository, every entry under `paths` that is not absolute is resolved
# relative to this config file's own directory, so all six `paths` keys (`registry`, `dataset_root`,
# `artifacts`, `checkpoints`, `results`, `third_party`) must be set to absolute paths.
#
# Create the ledger signing key ONCE, keep it, and reuse it for every run of this workbench:
# the key signs the evidence ledger, so a new key each shell makes every earlier run unverifiable.
#   umask 077 && mkdir -p "${XDG_CONFIG_HOME:-$HOME/.config}/cir"
#   python -c "import os,pathlib,secrets; (pathlib.Path(os.environ.get('XDG_CONFIG_HOME') or pathlib.Path.home()/'.config')/'cir'/'workbench_ledger_key').write_text(secrets.token_hex(32))"
# Then, in each shell that runs the workbench:
#   export WORKBENCH_LEDGER_KEY="$(cat "${XDG_CONFIG_HOME:-$HOME/.config}/cir/workbench_ledger_key")"
#
# Run command:
#   ./workbench/run.sh autopilot --config <this file> --apply --resume

schema_version: 1
selected_models:
  - limn

# The author publishes no training-condition label for these weights, so the strict-clean policy
# would refuse every variant. This admits them while the report records the condition as unpublished.
# To run a single category instead, name it under checkpoint_overrides, e.g.
#   checkpoint_overrides: {limn: [base_iter0_dress]}
checkpoint_policy: include_flagged_conditions
checkpoint_overrides: {}

paths:
  registry: ../registry/models.yaml
  # The FashionIQ root itself: the directory containing captions/, image_splits/, images/.
  dataset_root: ../../data/FashionIQ
  # Generated state: run directories, evidence ledger, completion proofs, reports, GPU capability
  # records, environment prefixes, the derived index. Keep it on persistent storage.
  artifacts: ../artifacts
  checkpoints: ../artifacts/checkpoints
  results: ../artifacts/results
  third_party: ../third_party

budgets:
  # 12 GiB: the three LIMN checkpoints total 5,376,030,471 bytes, leaving margin for the resize
  # output, the staged dictionaries and the index.
  max_download_bytes: 12884901888
  max_models: 4
  top_k: 200

permissions:
  allow_network: true
  allow_large_downloads: true
  # Authorizes conda environment creation and package installation for the selected model group on
  # cold-start. Pinned requirements go into a dedicated prefix; no environment the workbench did not
  # create is ever touched.
  allow_env_install: true
  allow_preparation: true
  allow_gpu_eval: true
  allow_index_write: true
