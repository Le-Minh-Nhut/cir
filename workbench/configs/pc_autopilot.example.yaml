# Example Autopilot profile.
#
# Copy to a private path outside the repository and edit for your host.
#
# Paths note:
# Every entry under `paths` that is not absolute is resolved relative to this config file's own
# directory. When copied outside the repository, all six `paths` keys (`registry`, `dataset_root`,
# `artifacts`, `checkpoints`, `results`, `third_party`) must be set to absolute paths.
#
# Ledger signing key:
# Create the key once and export it in each shell that runs the workbench:
#   umask 077 && mkdir -p "${XDG_CONFIG_HOME:-$HOME/.config}/cir"
#   python -c "import os,pathlib,secrets; (pathlib.Path(os.environ.get('XDG_CONFIG_HOME') or pathlib.Path.home()/'.config')/'cir'/'workbench_ledger_key').write_text(secrets.token_hex(32))"
#   export WORKBENCH_LEDGER_KEY="$(cat "${XDG_CONFIG_HOME:-$HOME/.config}/cir/workbench_ledger_key")"
# Omitting the variable is also safe: a 0600 key file is created under $XDG_CONFIG_HOME/cir/
# (default ~/.config/cir/) on first use and reused thereafter.
#
schema_version: 1
selected_models: all_registered
# Checkpoint selection. `strict_clean` evaluates only weights whose recorded training condition is
# exactly 0, so a model that publishes only noise-trained checkpoints is BLOCKED rather than silently
# evaluated. `include_flagged_conditions` runs those as an exploratory secondary cohort, each badged with
# the condition the registry records. `checkpoint_overrides` is an operator-resolved mapping (model id ->
# checkpoint id list) and wins over the policy, badged as an override rather than as clean.
checkpoint_policy: strict_clean
checkpoint_overrides: {}
paths:
  registry: ../registry/models.yaml
  dataset_root: ../../data/FashionIQ
  artifacts: ../artifacts
  checkpoints: ../artifacts/checkpoints
  results: ../artifacts/results
  third_party: ../third_party
budgets:
  # 10 GiB: covers the 3 declared LIMN checkpoints (5,376,030,471 bytes ~ 5.01 GiB) plus safety margin and auxiliary downloads
  max_download_bytes: 10737418240
  max_models: 256
  top_k: 200
permissions:
  allow_network: false
  allow_large_downloads: false
  allow_env_install: false
  allow_preparation: false
  allow_gpu_eval: false
  allow_gpu_preparation: false
  allow_index_write: false
