hydra:
  run:
    dir: outputs/r0_ncls_text_strong_aux_score_gain_stream/refit
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=outputs/r0_ncls_text_strong_aux_score_gain_stream/refit
    - hydra.mode=RUN
    task:
    - backbone=fgclip_base_text_native_cls
    - dataset.root=data/FashionIQ
    - +scorer_refit=gain_only
    - scorer_refit.mode=stream_refit
    - scorer_refit.source_checkpoint=outputs/r0_ncls_text_strong_aux/best.pt
    - scorer_refit.output_checkpoint=outputs/r0_ncls_text_strong_aux_score_gain_stream/score_gain_stream.pt
    - scorer_refit.stream_epochs=1
  job:
    name: refit_score_net
    chdir: false
    override_dirname: +scorer_refit=gain_only,backbone=fgclip_base_text_native_cls,dataset.root=data/FashionIQ,scorer_refit.mode=stream_refit,scorer_refit.output_checkpoint=outputs/r0_ncls_text_strong_aux_score_gain_stream/score_gain_stream.pt,scorer_refit.source_checkpoint=outputs/r0_ncls_text_strong_aux/best.pt,scorer_refit.stream_epochs=1
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.5
    version_base: '1.3'
    cwd: /home/heheboiz/data/cir
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/heheboiz/data/cir/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/heheboiz/data/cir/outputs/r0_ncls_text_strong_aux_score_gain_stream/refit
    choices:
      scorer_refit: gain_only
      protocol: fashioniq_original
      experiment: iag_srme_base_full
      objective: core
      backbone: fgclip_base_text_native_cls
      model: iag_srme
      dataset: fashioniq
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
